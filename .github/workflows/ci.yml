name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-and-privacy:
    name: Docs and privacy validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Validate planning foundation
        run: node scripts/validate-planning-foundation.js

      - name: Validate Portfolio-first roadmap
        run: node scripts/validate-portfolio-first-roadmap.js

      - name: Validate Auto Draft PR handoff
        run: node scripts/validate-auto-draft-pr-handoff.js

      - name: Validate Issue #26 quality gate inventory
        run: node scripts/validate-quality-gates.js

      - name: Validate GitHub metadata and privacy state
        run: node scripts/validate-github-metadata-state.js

  frontend:
    name: Frontend scaffold checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high

  e2e:
    name: E2E browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke
        run: npm run e2e

  backend:
    name: Backend scaffold checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run backend tests
        run: mvn test

      - name: Package backend
        run: mvn package -DskipTests

  analytics:
    name: Analytics scaffold checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics-service/pyproject.toml

      - name: Install analytics test dependencies
        run: python -m pip install -e .[test]

      - name: Run analytics tests
        run: python -m pytest

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose topology
        run: docker compose -f docker-compose.yml config
